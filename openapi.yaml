openapi: 3.0.0
info:
  title: Leads API
  version: 1.0.0

paths:
  /leads:
    post:
      summary: Create lead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, source]
              properties:
                name:
                  type: string
                source:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lead'

  /leads/{id}/score:
    post:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                score:
                  type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lead'

components:
  schemas:
    Lead:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        source:
          type: string
        status:
          type: string
        score:
          type: integer